name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Sync to ~/te_bot and restart bot
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='*.log' \
            --exclude='bot.pid' \
            "$GITHUB_WORKSPACE/" ~/te_bot/
          cd ~/te_bot
          npm install --omit=dev
          pm2 restart te-bot --update-env || pm2 start src/bot.js --name te-bot --time
          pm2 save
          echo "=== Deploy done ==="
          pm2 list
